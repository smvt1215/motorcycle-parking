  <!-- Source of every app icon and splash raster; render with tool/render_brand_icons.py.
       Layer "background" bleeds past the canvas for the Android adaptive background.
       Layer "mark" stays inside a 469-unit circle around the center (adaptive safe zone).
       In the monochrome (themed) icon, data-mono="skip" parts are left out and
       data-mono="cut" parts erase what is drawn below them. -->
