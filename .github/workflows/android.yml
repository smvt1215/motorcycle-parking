name: Android
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  # Only a PR's newer push replaces its run. Every main push runs to the end,
  # or CD (which waits for CI, Android and iOS) never sees a finished commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  release:
    name: Android Release APK 建置
    # Compile check only: a pull request already ran it on the same tree
    # (squash merges keep it), and CD staging builds the signed release on
    # main anyway.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: changes
        run: python3 tool/ci_changes.py android >> "$GITHUB_OUTPUT"
      - id: versions
        if: steps.changes.outputs.run == 'true'
        run: echo "flutter=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: steps.changes.outputs.run == 'true'
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          cache: true
      - if: steps.changes.outputs.run == 'true'
        run: flutter pub get --enforce-lockfile
      - if: steps.changes.outputs.run == 'true'
        run: flutter build apk --release --flavor production
      - name: Validate staging release configuration without secrets
        if: steps.changes.outputs.run == 'true'
        run: flutter build apk --release --flavor staging
  apk:
    name: Android 測試 APK 建置
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: changes
        run: python3 tool/ci_changes.py android >> "$GITHUB_OUTPUT"
      - id: versions
        if: steps.changes.outputs.run == 'true'
        run: echo "flutter=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: steps.changes.outputs.run == 'true'
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          cache: true
      - if: steps.changes.outputs.run == 'true'
        run: flutter pub get --enforce-lockfile
      - if: steps.changes.outputs.run == 'true'
        run: flutter build apk --debug --flavor production --target=integration_test/ui_test.dart --target-platform=android-x64 --dart-define=OFFLINE_MAP=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.changes.outputs.run == 'true'
        with:
          name: android-test-apk
          path: build/app/outputs/flutter-apk/app-production-debug.apk
          if-no-files-found: error
          compression-level: 0
          overwrite: true
  emulator:
    name: Android ${{ matrix.version }} 模擬器
    needs: [apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            version: '11'
          - api: 36
            version: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: versions
        if: needs.apk.outputs.run == 'true'
        run: echo "flutter=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        if: needs.apk.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: needs.apk.outputs.run == 'true'
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          cache: true
      - if: needs.apk.outputs.run == 'true'
        run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.apk.outputs.run == 'true'
        with:
          name: android-test-apk
          path: artifacts/android-app
      - name: Enable KVM
        if: needs.apk.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        if: needs.apk.outputs.run == 'true'
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 180
          # A normal run takes about 3 minutes. The emulator sometimes goes offline after the tests finish, so the
          # driver loses the results; reconnect and retry once instead of failing the job.
          script: python3 tool/retry_command.py --attempts 2 --timeout-minutes 8 --before-retry 'adb reconnect offline; adb wait-for-device' -- flutter drive --debug --flavor production --driver=test_driver/integration_test.dart --target=integration_test/ui_test.dart --use-application-binary=artifacts/android-app/app-production-debug.apk -d emulator-5554
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && needs.apk.outputs.run == 'true'
        with:
          name: android-${{ matrix.api }}-screenshots
          path: artifacts/screenshots
          if-no-files-found: error
  android-ok:
    name: Android 全部通過
    runs-on: ubuntu-24.04
    if: always()
    needs: [release, apk, emulator]
    steps:
      - env:
          RELEASE: ${{ needs.release.result }}
          APK: ${{ needs.apk.result }}
          EMULATOR: ${{ needs.emulator.result }}
          EVENT_NAME: ${{ github.event_name }}
        # The release compile runs on pull requests only (see the job).
        run: |
          case "$EVENT_NAME:$RELEASE" in
            *:success | push:skipped) ;;
            *) exit 1 ;;
          esac
          test "$APK" = success && test "$EMULATOR" = success
