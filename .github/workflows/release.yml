name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  gate:
    name: Validate release tag, CI and staging
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    outputs:
      version: ${{ steps.gate.outputs.version }}
      channel: ${{ steps.gate.outputs.channel }}
      build_number: ${{ steps.gate.outputs.build_number }}
      build_first: ${{ steps.gate.outputs.build_first }}
      build_last: ${{ steps.gate.outputs.build_last }}
      hash_sources: ${{ steps.gate.outputs.hash_sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/cd_gate.py release --sha "$(git rev-parse HEAD)" --wait 3600
  backend:
    name: Approved production backend deploy
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck after human approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/cd_gate.py release --sha "$(git rev-parse HEAD)"
      # Only an RC deploys production: a beta tests against staging, which
      # the gate already requires for this SHA, so beta migrations never
      # reach production. A store release ships the RC's build, whose backend
      # is already live; redeploying that older commit could roll back
      # functions a later RC shipped.
      - uses: ./.github/actions/backend-deploy
        if: needs.gate.outputs.channel == 'rc'
        with:
          environment: production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      - name: Prepare draft release for recoverable binary hashes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tool/release_notes.py prepare "$RELEASE_TAG"
  android:
    name: Publish Android (Play testing track or production rollout)
    needs: [gate, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write
      actions: read
    outputs:
      build: ${{ steps.store.outputs.build }}
    env:
      CD_ENVIRONMENT: production
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.gate.outputs.channel }}
      HASH_SOURCES: ${{ needs.gate.outputs.hash_sources }}
      BUILD_NUMBER: ${{ needs.gate.outputs.build_number }}
      BUILD_FIRST: ${{ needs.gate.outputs.build_first }}
      BUILD_LAST: ${{ needs.gate.outputs.build_last }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # Beta builds connect to staging (see the testing lanes).
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck after human approval
        run: python3 tool/cd_gate.py release --sha "$(git rev-parse HEAD)"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/mobile-setup
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Upload to a testing track or promote the RC build
        id: store
        run: bundle exec fastlane android ${{ needs.gate.outputs.channel == 'release' && 'release' || 'testing' }}
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" config/production.json config/maps.local.json config/maps.generated.json android/maps.properties
  ios:
    name: Publish iOS (TestFlight or App Store review)
    needs: [gate, backend]
    runs-on: macos-26
    timeout-minutes: 180
    environment: production
    permissions:
      contents: write
      actions: read
    outputs:
      build: ${{ steps.store.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.gate.outputs.channel }}
      HASH_SOURCES: ${{ needs.gate.outputs.hash_sources }}
      BUILD_NUMBER: ${{ needs.gate.outputs.build_number }}
      BUILD_FIRST: ${{ needs.gate.outputs.build_first }}
      BUILD_LAST: ${{ needs.gate.outputs.build_last }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # Beta builds connect to staging (see the testing lanes).
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      APP_STORE_APP_ID: ${{ vars.APP_STORE_APP_ID }}
      TESTFLIGHT_GROUP: ${{ vars.TESTFLIGHT_GROUP }}
      APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
      APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
      APP_STORE_KEY_BASE64: ${{ secrets.APP_STORE_KEY_BASE64 }}
      APP_STORE_COPYRIGHT: ${{ vars.APP_STORE_COPYRIGHT }}
      APP_STORE_SUPPORT_URL: ${{ vars.APP_STORE_SUPPORT_URL }}
      APP_STORE_PRIVACY_URL: ${{ vars.APP_STORE_PRIVACY_URL }}
      APP_STORE_SUBMISSION_INFORMATION: ${{ secrets.APP_STORE_SUBMISSION_INFORMATION }}
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck after human approval
        run: python3 tool/cd_gate.py release --sha "$(git rev-parse HEAD)"
      - uses: ./.github/actions/mobile-setup
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Upload to TestFlight or submit the RC build for review
        id: store
        run: bundle exec fastlane ios ${{ needs.gate.outputs.channel == 'release' && 'release' || 'testing' }}
      - name: Remove signing material and private IPA
        if: always()
        run: |
          python3 tool/ios_signing.py cleanup
          rm -rf build/ios/ipa build/ios/archive
          rm -f config/production.json config/maps.local.json config/maps.generated.json ios/Flutter/Maps.xcconfig
  github-release:
    name: Publish GitHub Release with original binary hashes
    needs: [android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ANDROID_BUILD: ${{ needs.android.outputs.build }}
          IOS_BUILD: ${{ needs.ios.outputs.build }}
        run: python3 tool/release_notes.py publish "$RELEASE_TAG"
