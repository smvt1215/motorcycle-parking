name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Only a PR's newer push replaces its run. Every main push runs to the end,
  # or CD (which waits for CI, Android and iOS) never sees a finished commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  automation:
    name: CD 閘門與發版重跑測試
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: |
          ruby -c fastlane/Fastfile
          ruby fastlane/test_release_policy.rb
          bundle exec fastlane lanes
  quality:
    name: Flutter 檢查（格式／分析／測試／Web）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        run: python3 tool/ci_changes.py quality >> "$GITHUB_OUTPUT"
      - id: versions
        if: steps.changes.outputs.run == 'true'
        run: echo "flutter=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.changes.outputs.run == 'true'
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          cache: true
      - if: steps.changes.outputs.run == 'true'
        run: flutter pub get --enforce-lockfile
      - if: steps.changes.outputs.run == 'true'
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Enforce official UI package imports
        if: steps.changes.outputs.run == 'true'
        # grep ships with every runner (rg does not). Exit 1 means no match;
        # any other failure must fail the step instead of passing silently.
        run: |
          status=0
          grep -rEn --include='*.dart' 'package:flutter/(material|cupertino)\.dart' lib test integration_test || status=$?
          if [ "$status" -eq 0 ]; then
            echo 'Import material_ui or cupertino_ui through the adaptive layer.'
            exit 1
          fi
          [ "$status" -eq 1 ]
      - if: steps.changes.outputs.run == 'true'
        run: flutter analyze --fatal-infos
      # Version policy still applies to documentation-only PRs.
      - run: python3 tool/check_version.py
      # The incompatible-release mark is checked against the PR base too.
      - run: python3 tool/check_app_compat.py
      - name: Generated API client matches supabase/api/v1
        if: steps.changes.outputs.run == 'true'
        run: python3 tool/gen_api_dart.py --check
      - name: Check generated seed
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 tool/generate_seed.py
          git diff --exit-code -- supabase/seed.sql
      - if: steps.changes.outputs.run == 'true'
        run: flutter test --coverage --dart-define=OFFLINE_MAP=true
      - name: OAuth flow with default map configuration
        if: steps.changes.outputs.run == 'true'
        run: flutter test --no-pub test/auth_flow_test.dart
      - if: steps.changes.outputs.run == 'true'
        run: |
          flutter build web --no-web-resources-cdn --no-wasm-dry-run
          python3 tool/web_private_assets.py strip build/web
      - name: Build admin web entrypoint
        if: steps.changes.outputs.run == 'true'
        run: |
          flutter build web -t lib/main_admin.dart -o build/admin --no-web-resources-cdn --no-wasm-dry-run
          python3 tool/prepare_admin_web.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changes.outputs.run == 'true'
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
  backend:
    name: 後端（Edge Functions／資料庫 RLS）
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: changes
        run: python3 tool/ci_changes.py backend >> "$GITHUB_OUTPUT"
      - id: versions
        if: steps.changes.outputs.run == 'true'
        run: echo "supabase=$(cat .supabase-version)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        if: steps.changes.outputs.run == 'true'
        with:
          deno-version: 2.7.7
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        if: steps.changes.outputs.run == 'true'
        with:
          version: ${{ steps.versions.outputs.supabase }}
      - name: Check generated contract SQL
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 tool/gen_contract_sql.py
          git diff --exit-code -- supabase/contract supabase/tests/parking_contract_test.sql supabase/tests/rule_verdict_test.sql
          test -z "$(git status --porcelain -- supabase/contract supabase/tests/parking_contract_test.sql supabase/tests/rule_verdict_test.sql)"
      - name: Edge Function checks
        if: steps.changes.outputs.run == 'true'
        working-directory: supabase/functions
        run: |
          deno fmt --check
          deno lint
          deno check submit-report/index.ts submit-sighting/index.ts geocode/index.ts admin-users/index.ts availability-ingest/index.ts account-deletion/index.ts apple-revoke/index.ts support-request/index.ts support-confirm/index.ts support-mail/index.ts report-mail/index.ts
          # availability-ingest reads its fixed feed samples.
          deno test --allow-read=.
      - name: API response checker
        if: steps.changes.outputs.run == 'true'
        working-directory: supabase/api/v1
        run: |
          deno fmt --check
          deno lint
          deno test --allow-read=.
      - name: Rebuild local database and check RLS
        if: steps.changes.outputs.run == 'true'
        run: |
          supabase start > /tmp/supabase-start.log 2>&1 || { cat /tmp/supabase-start.log; exit 1; }
          supabase test db
      # Every function in supabase/api/v1 is called on the rebuilt stack and
      # its answer validated against the document (#195 P1).
      - name: API responses match supabase/api/v1
        if: steps.changes.outputs.run == 'true'
        working-directory: supabase/api/v1
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" \
            deno run --allow-read=. --allow-env --allow-net check_responses.ts
      - name: Stop local stack
        if: always() && steps.changes.outputs.run == 'true'
        run: supabase stop
  admin-react:
    name: 管理站 React（型別／lint／測試／建置）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin_web/react
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: changes
        working-directory: .
        run: python3 tool/ci_changes.py admin_react >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin_web/react/package-lock.json
      - if: steps.changes.outputs.run == 'true'
        run: npm ci
      - if: steps.changes.outputs.run == 'true'
        run: npm run format:check
      - if: steps.changes.outputs.run == 'true'
        run: npm run lint
      - if: steps.changes.outputs.run == 'true'
        run: npm test
      # build runs tsc -b first, so it also type-checks.
      - if: steps.changes.outputs.run == 'true'
        run: npm run build
      - name: Production bundle carries no sample data
        if: steps.changes.outputs.run == 'true'
        run: |
          status=0
          grep -rl -e MOTOPARK_ADMIN_FIXTURE_DATA -e 西門町峨眉立體停車場 dist || status=$?
          if [ "$status" -eq 0 ]; then
            echo 'src/review/fixtureSource.ts leaked into the production build.'
            exit 1
          fi
          [ "$status" -eq 1 ]
      - if: steps.changes.outputs.run == 'true'
        run: npm run build:fixture
      - name: Generated API client matches supabase/api/v1
        if: steps.changes.outputs.run == 'true'
        run: |
          npm run codegen
          git diff --exit-code -- src/api/v1
          test -z "$(git status --porcelain -- src/api/v1)"
  public-web:
    name: 公開網頁 React（型別／lint／測試／建置）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: public_web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: changes
        working-directory: .
        run: python3 tool/ci_changes.py public_web >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: public_web/package-lock.json
      - if: steps.changes.outputs.run == 'true'
        run: npm ci
      - if: steps.changes.outputs.run == 'true'
        run: npm run format:check
      - if: steps.changes.outputs.run == 'true'
        run: npm run lint
      # src/content.test.ts reads lib/domain/account_deletion_display.dart.
      - if: steps.changes.outputs.run == 'true'
        run: npm test
      # build runs tsc -b first, so it also type-checks.
      - if: steps.changes.outputs.run == 'true'
        run: npm run build
  ci-ok:
    name: CI 全部通過
    runs-on: ubuntu-24.04
    if: always()
    needs: [quality, backend, automation, admin-react, public-web]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in jobs.values()), jobs
          PY
