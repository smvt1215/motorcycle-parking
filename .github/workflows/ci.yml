name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: versions
        run: echo "flutter=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Enforce official UI package imports
        run: |
          if rg 'package:flutter/(material|cupertino)\.dart' lib test integration_test; then
            echo 'Import material_ui or cupertino_ui through the adaptive layer.'
            exit 1
          fi
      - run: flutter analyze --fatal-infos
      - run: python3 tool/check_version.py
      - name: Check generated seed
        run: |
          python3 tool/generate_seed.py
          git diff --exit-code -- supabase/seed.sql
      - run: flutter test --coverage --dart-define=OFFLINE_MAP=true
      - run: flutter build web --no-web-resources-cdn --no-wasm-dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: changes
        run: python3 tool/ci_changes.py backend >> "$GITHUB_OUTPUT"
      - id: versions
        if: steps.changes.outputs.run == 'true'
        run: echo "supabase=$(cat .supabase-version)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        if: steps.changes.outputs.run == 'true'
        with:
          deno-version: 2.7.7
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        if: steps.changes.outputs.run == 'true'
        with:
          version: ${{ steps.versions.outputs.supabase }}
      - name: Edge Function checks
        if: steps.changes.outputs.run == 'true'
        working-directory: supabase/functions
        run: |
          deno fmt --check
          deno lint
          deno check tdx-parking/index.ts submit-report/index.ts
          deno test --allow-read=tdx-parking/fixtures
      - name: Rebuild local database and check RLS
        if: steps.changes.outputs.run == 'true'
        run: |
          supabase start > /tmp/supabase-start.log 2>&1 || { cat /tmp/supabase-start.log; exit 1; }
          supabase test db
      - name: Stop local stack
        if: always() && steps.changes.outputs.run == 'true'
        run: supabase stop
  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: versions
        run: echo "flutter=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug
  ci-ok:
    runs-on: ubuntu-24.04
    if: always()
    needs: [quality, backend, android-build]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in jobs.values()), jobs
          PY
