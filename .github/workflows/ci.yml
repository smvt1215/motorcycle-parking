name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  automation:
    name: CD 閘門與發版重跑測試
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: |
          ruby -c fastlane/Fastfile
          ruby fastlane/test_release_policy.rb
          bundle exec fastlane lanes
  quality:
    name: Flutter 檢查（格式／分析／測試／Web）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        run: python3 tool/ci_changes.py quality >> "$GITHUB_OUTPUT"
      - id: versions
        if: steps.changes.outputs.run == 'true'
        run: echo "flutter=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.changes.outputs.run == 'true'
        with:
          flutter-version: ${{ steps.versions.outputs.flutter }}
          cache: true
      - if: steps.changes.outputs.run == 'true'
        run: flutter pub get --enforce-lockfile
      - if: steps.changes.outputs.run == 'true'
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Enforce official UI package imports
        if: steps.changes.outputs.run == 'true'
        run: |
          if rg 'package:flutter/(material|cupertino)\.dart' lib test integration_test; then
            echo 'Import material_ui or cupertino_ui through the adaptive layer.'
            exit 1
          fi
      - if: steps.changes.outputs.run == 'true'
        run: flutter analyze --fatal-infos
      # Version policy still applies to documentation-only PRs.
      - run: python3 tool/check_version.py
      - name: Check generated seed
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 tool/generate_seed.py
          git diff --exit-code -- supabase/seed.sql
      - if: steps.changes.outputs.run == 'true'
        run: flutter test --coverage --dart-define=OFFLINE_MAP=true
      - if: steps.changes.outputs.run == 'true'
        run: flutter build web --no-web-resources-cdn --no-wasm-dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.changes.outputs.run == 'true'
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
  backend:
    name: 後端（Edge Functions／資料庫 RLS）
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: changes
        run: python3 tool/ci_changes.py backend >> "$GITHUB_OUTPUT"
      - id: versions
        if: steps.changes.outputs.run == 'true'
        run: echo "supabase=$(cat .supabase-version)" >> "$GITHUB_OUTPUT"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        if: steps.changes.outputs.run == 'true'
        with:
          deno-version: 2.7.7
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v1
        if: steps.changes.outputs.run == 'true'
        with:
          version: ${{ steps.versions.outputs.supabase }}
      - name: Edge Function checks
        if: steps.changes.outputs.run == 'true'
        working-directory: supabase/functions
        run: |
          deno fmt --check
          deno lint
          deno check submit-report/index.ts
          deno test
      - name: Rebuild local database and check RLS
        if: steps.changes.outputs.run == 'true'
        run: |
          supabase start > /tmp/supabase-start.log 2>&1 || { cat /tmp/supabase-start.log; exit 1; }
          supabase test db
      - name: Stop local stack
        if: always() && steps.changes.outputs.run == 'true'
        run: supabase stop
  ci-ok:
    name: CI 全部通過
    runs-on: ubuntu-24.04
    if: always()
    needs: [quality, backend, automation]
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in jobs.values()), jobs
          PY
