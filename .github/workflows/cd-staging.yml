name: CD staging
on:
  workflow_run:
    workflows: [CI, Android, iOS]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  gate:
    name: Check staging prerequisites
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tool/cd_gate.py staging --sha "$SOURCE_SHA"
  deploy:
    name: Staging backend deploy
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: staging
    concurrency:
      group: cd-staging
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.deployed.outputs.deployed }}
      android: ${{ steps.mobile.outputs.android }}
      ios: ${{ steps.mobile.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # Test builds are optional until signing is set up: a platform with none of its settings is skipped,
      # while a partly configured one still runs and fails on the missing values.
      - id: mobile
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          GOOGLE_MAPS_IOS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
        run: python3 tool/cd_mobile_setup.py >> "$GITHUB_OUTPUT"
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tool/cd_gate.py staging --sha "$SOURCE_SHA"
      - uses: ./.github/actions/backend-deploy
        if: steps.current.outputs.deploy == 'true'
        with:
          environment: staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      - name: Record staging deployment
        id: deployed
        if: steps.current.outputs.deploy == 'true'
        run: echo 'deployed=true' >> "$GITHUB_OUTPUT"
  admin-web:
    name: Staging admin Hosting
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: cd-staging-admin
      cancel-in-progress: false
    env:
      FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
    steps:
      - name: Check Hosting setup
        id: setup
        run: |
          if [ -z "$FIREBASE_HOSTING_SITE" ]; then
            echo 'Hosting is not enabled: set staging FIREBASE_HOSTING_SITE after creating the site and granting Hosting permissions.' >> "$GITHUB_STEP_SUMMARY"
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.setup.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: ./.github/actions/mobile-setup
        if: steps.setup.outputs.enabled == 'true'
      - name: Build admin site
        if: steps.setup.outputs.enabled == 'true'
        run: |
          python3 tool/cd_config.py staging web
          flutter build web -t lib/main_admin.dart -o build/admin --no-web-resources-cdn --no-wasm-dry-run --dart-define-from-file=config/staging.json
          python3 tool/prepare_admin_web.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.setup.outputs.enabled == 'true'
        with:
          node-version: '22'
      - if: steps.setup.outputs.enabled == 'true'
        run: npm install --global firebase-tools@15.33.0
      - id: current
        if: steps.setup.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tool/cd_gate.py latest --sha "$SOURCE_SHA"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        if: steps.current.outputs.deploy == 'true'
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Deploy admin Hosting
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          firebase target:apply hosting admin-staging "$FIREBASE_HOSTING_SITE" --project staging --non-interactive
          # Check again after exchanging OIDC credentials and preparing the target.
          python3 tool/cd_gate.py latest --sha "$SOURCE_SHA" > "$RUNNER_TEMP/latest.log"
          if grep -q 'Skipped:' "$RUNNER_TEMP/latest.log"; then exit 0; fi
          firebase deploy --only hosting:admin-staging --project staging --non-interactive
      - name: Remove generated configuration
        if: always() && steps.setup.outputs.enabled == 'true'
        run: rm -f config/staging.json
  android-apk:
    name: Staging Android APK
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true' && needs.deploy.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: cd-staging-android
      cancel-in-progress: false
    env:
      CD_ENVIRONMENT: staging
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      # App Check (#203): FirebaseOptions for this platform's app, read by tool/cd_config.py.
      FIREBASE_ANDROID_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'motocycle-parking-guide' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/mobile-setup
      - run: python3 tool/cd_config.py staging android
      - name: Build signed staging APK
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          flutter build apk --release --flavor staging --build-number="$(git rev-list --count HEAD)" --dart-define-from-file=config/staging.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-android-${{ github.event.workflow_run.head_sha }}
          path: build/app/outputs/flutter-apk/app-staging-release.apk
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --global firebase-tools@15.33.0
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tool/cd_gate.py latest --sha "$SOURCE_SHA"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.current.outputs.deploy == 'true'
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Distribute APK to invited testers
        if: steps.current.outputs.deploy == 'true'
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          : "${FIREBASE_APP_ID:?Missing Firebase Android App ID}"
          # Recheck after OIDC exchange, immediately before the external write.
          python3 tool/cd_gate.py latest --sha "$SOURCE_SHA" > "$RUNNER_TEMP/latest.log"
          if grep -q 'Skipped:' "$RUNNER_TEMP/latest.log"; then exit 0; fi
          git log -1 --format='Alpha（內部預覽）%n%H%n%s' > "$RUNNER_TEMP/release-notes.txt"
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-staging-release.apk --app "$FIREBASE_APP_ID" --groups staging-android --release-notes-file "$RUNNER_TEMP/release-notes.txt" --non-interactive
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" config/staging.json config/maps.local.json config/maps.generated.json android/maps.properties
  ios-ipa:
    name: Staging iOS IPA
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true' && needs.deploy.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: cd-staging-ios
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_IOS_API_KEY }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      # App Check (#203): FirebaseOptions for this platform's app, read by tool/cd_config.py.
      FIREBASE_IOS_API_KEY: ${{ vars.FIREBASE_IOS_API_KEY }}
      FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'motocycle-parking-guide' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/mobile-setup
      - run: python3 tool/cd_config.py staging ios
      - run: python3 tool/ios_signing.py staging
      - name: Build Ad Hoc IPA
        run: flutter build ipa --release --flavor staging --build-number="$IOS_BUILD_NUMBER" --dart-define-from-file=config/staging.json --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --global firebase-tools@15.33.0
      - id: current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tool/cd_gate.py latest --sha "$SOURCE_SHA"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: steps.current.outputs.deploy == 'true'
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Distribute IPA to invited testers
        if: steps.current.outputs.deploy == 'true'
        env:
          FIREBASE_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          : "${FIREBASE_APP_ID:?Missing Firebase iOS App ID}"
          # Recheck after OIDC exchange, immediately before the external write.
          python3 tool/cd_gate.py latest --sha "$SOURCE_SHA" > "$RUNNER_TEMP/latest.log"
          if grep -q 'Skipped:' "$RUNNER_TEMP/latest.log"; then exit 0; fi
          git log -1 --format='Alpha（內部預覽）%n%H%n%s' > "$RUNNER_TEMP/release-notes.txt"
          shopt -s nullglob
          ipa=(build/ios/ipa/*.ipa)
          test "${#ipa[@]}" = 1
          firebase appdistribution:distribute "${ipa[0]}" --app "$FIREBASE_APP_ID" --groups staging-ios --release-notes-file "$RUNNER_TEMP/release-notes.txt" --non-interactive
      - name: Remove signing material and private IPA
        if: always()
        run: |
          python3 tool/ios_signing.py cleanup
          rm -rf build/ios/ipa build/ios/archive
          rm -f config/staging.json config/maps.local.json config/maps.generated.json ios/Flutter/Maps.xcconfig
