version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    groups:
      pub-minor-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
