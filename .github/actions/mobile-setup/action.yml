name: Mobile build setup
description: Install the pinned Flutter SDK and locked application dependencies.
inputs:
  heavy-glyph:
    description: >-
      The licensed heavy-bike badge SVG, base64-encoded (a secret); store
      builds pass it, every other build leaves it empty.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "flutter=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        flutter-version: ${{ steps.version.outputs.flutter }}
        cache: true
    - shell: bash
      run: flutter pub get --enforce-lockfile
    # The licensed badge silhouette, only in this step's environment;
    # builds without it draw the fallback icon.
    - shell: bash
      env:
        HEAVY_GLYPH_SVG_BASE64: ${{ inputs.heavy-glyph }}
      run: python3 tool/fetch_heavy_glyph.py
