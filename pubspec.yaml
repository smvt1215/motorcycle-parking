name: motorcycle_parking
description: 台灣機車與大型重機停車指南
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: 1.8.0
  cupertino_ui: 1.1.4
  cupertino_icons: ^2.0.0
  cupertino_native_better: 1.7.0
  material_3_expressive: 1.2.0
  dynamic_color: ^2.1.0
  google_maps_flutter: 2.19.0
  google_maps_flutter_ios_sdk9: 2.19.0
  pointer_interceptor: 0.10.1+3
  flutter_map: ^8.2.2
  flutter_map_marker_cluster: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.1.2
  flutter_riverpod: ^3.0.3
  go_router: ^18.1.1
  supabase_flutter: ^2.18.3
  flutter_svg: ^2.3.0
  http: ^1.6.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  share_plus: 13.3.1
  flutter_local_notifications: ^22.3.2
  uuid: ^4.5.2
  timezone: ^0.11.2
  package_info_plus: ^10.2.2
  image_picker: ^1.2.4
  firebase_core: ^5.1.0
  firebase_app_check: ^0.5.1
dev_dependencies:
  google_maps_flutter_platform_interface: 2.17.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
  assets:
    - assets/rules/parking_rules.json
    - assets/demo/spots.json
    - assets/branding/png/splash_mark.png
