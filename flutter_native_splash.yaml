# Native launch screen. Regenerate: dart run flutter_native_splash:create
# splash_mark.png comes from tool/render_brand_icons.py; lib/features/launch
# draws it at the same size so the Flutter loading screen continues it.
flutter_native_splash:
  color: "#1F5FA8"
  color_dark: "#1C2126"
  image: assets/branding/png/splash_mark.png
  android_gravity: center
  ios_content_mode: center
  web: false

  android_12:
    color: "#1F5FA8"
    color_dark: "#1C2126"
    image: assets/branding/png/splash_mark.png
